name: CI

"on":
  push:
    branches: [master, feature/trim-workout]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Assemble mainline debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Build mainline debug
        run: ./gradlew :app:assembleMainlineDebug --no-daemon --stacktrace
