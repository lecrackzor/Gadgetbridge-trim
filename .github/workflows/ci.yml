name: CI

"on":
  push:
    branches: [master, feature/trim-workout]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Assemble mainline debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Avoid obsolete default "tools" package from setup-android@v3.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          # AGP compileSdk release(37) maps to platforms;android-37.0
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build mainline debug
        run: ./gradlew :app:assembleMainlineDebug --no-daemon --stacktrace
